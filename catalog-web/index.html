<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <title>Catálogo de Tienda</title>
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Archivo de estilos externo -->
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

    <header>
    <div class="header-content">
        <button id="cart-button" class="cart-button">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16"><path d="M0 1a1 1 0 0 1 1-1h1.5a.5.5 0 0 1 .485.379L3.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L1.01 3.607 0 1zM4.415 4l1.07 5.8h6.03L11.585 4H4.415zM6 13a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm5 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/></svg>
            <span id="cart-count" class="cart-badge">0</span>
        </button>
        <div class="header-brand">
            <img id="store-logo" src="" alt="Logo de la tienda">
            <h1 id="store-name">Cargando Catálogo...</h1>
        </div>
    </div>
</header>

    <main>
        <div id="loader" class="loader-container">
            <div class="spinner"></div>
            <div class="loader-text">Preparando el catálogo...</div>
        </div>

        <div id="message-container" class="message-box" style="display: none;">
            <h2 id="msg-title"></h2>
            <p id="msg-desc"></p>
        </div>

        <div id="product-grid" class="product-grid"></div>
    </main>

    <!-- Archivo de scripts externo -->
    <!-- Product Detail Modal -->
<div id="product-modal" class="modal hidden">
    <div class="modal-content modal-product">
        <button class="modal-close-btn" onclick="closeProductModal()">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/></svg>
        </button>
        <div class="modal-image-wrapper">
            <img id="modal-image" src="" alt="" class="modal-image">
        </div>
        <div class="modal-body">
            <h2 id="modal-title"></h2>
            <p id="modal-description"></p>
            <div class="modal-footer">
                <p id="modal-price" class="modal-price"></p>
                <button class="btn-add-cart" onclick="addCurrentToCart()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16" style="margin-right:6px"><path d="M0 1a1 1 0 0 1 1-1h1.5a.5.5 0 0 1 .485.379L3.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L1.01 3.607 0 1zM4.415 4l1.07 5.8h6.03L11.585 4H4.415zM6 13a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm5 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/></svg>
                    Agregar al carrito
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Shopping Cart Modal -->
<div id="cart-modal" class="modal hidden">
    <div class="modal-content">
        <span class="modal-close" onclick="closeCartModal()">&times;</span>
        <h2>Carrito</h2>
        <ul id="cart-items" class="cart-list"></ul>
        <p id="cart-total" class="cart-total" style="font-weight:600;margin-top:1rem;"></p>
        <button class="btn-clear-cart" onclick="clearCart()">Vaciar carrito</button>
    </div>
</div>
    <script src="assets/js/script.js"></script>
</body>

</html>
