<div class="product-card" [style]="delayStyle">
  <div class="product-image-container">
    <img
      [src]="imageSrc"
      [alt]="product.name"
      class="product-image"
      (error)="onImgError($event)"
    />
  </div>
  <div class="product-info">
    <h3 class="product-title">{{ product.name }}</h3>
    <p class="product-description">{{ product.description || 'Sin descripción detallada.' }}</p>
    <div class="product-footer">
      <span class="product-price">{{ formatMXN(product.price) }}</span>
      <button class="btn-view" (click)="onVerMas()">Ver más</button>
    </div>
  </div>
</div>
