@if (product) {
  <div
    id="product-modal"
    class="modal"
    [class.hidden]="!product"
    [class.visible]="visible"
    (click)="onOverlayClick($event)"
  >
    <div class="modal-content modal-product">
      <button class="modal-close-btn" (click)="onClose()" aria-label="Cerrar">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
          <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/>
        </svg>
      </button>

      <div class="modal-image-wrapper">
        <img
          [src]="imageSrc"
          [alt]="product.name"
          class="modal-image"
          (error)="onImgError($event)"
        />
      </div>

      <div class="modal-body">
        <h2 id="modal-title">{{ product.name }}</h2>
        <p id="modal-description">{{ product.description || 'Sin descripción detallada.' }}</p>
        <div class="modal-footer">
          <p id="modal-price" class="modal-price">{{ formatMXN(product.price) }}</p>
          <button class="btn-add-cart" (click)="onAddToCart()">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"
                 viewBox="0 0 16 16" style="margin-right:6px">
              <path d="M0 1a1 1 0 0 1 1-1h1.5a.5.5 0 0 1 .485.379L3.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L1.01 3.607 0 1zM4.415 4l1.07 5.8h6.03L11.585 4H4.415zM6 13a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm5 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/>
            </svg>
            Agregar al carrito
          </button>
        </div>
      </div>
    </div>
  </div>
}
