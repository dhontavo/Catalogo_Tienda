<ion-header>
    <ion-toolbar color="primary">
        <ion-title>Actualizar Contraseña</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
    <div class="header-info">
        <ion-icon name="lock-closed-outline" class="main-icon"></ion-icon>
        <h2>Seguridad Requerida</h2>
        <p>Has iniciado sesión con una contraseña temporal. Por tu seguridad, debes establecer una nueva contraseña
            ahora.</p>
    </div>

    <ion-list lines="none">
        <ion-item class="custom-input">
            <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
            <ion-label position="floating">Nueva Contraseña</ion-label>
            <ion-input type="password" [(ngModel)]="newPassword"></ion-input>
        </ion-item>

        <ion-item class="custom-input">
            <ion-icon name="checkmark-circle-outline" slot="start"></ion-icon>
            <ion-label position="floating">Confirmar Contraseña</ion-label>
            <ion-input type="password" [(ngModel)]="confirmPassword"></ion-input>
        </ion-item>
    </ion-list>

    <div class="requirements">
        <p [class.met]="newPassword.length >= 8">✓ Mínimo 8 caracteres</p>
        <p [class.met]="hasUpper(newPassword)">✓ Mayúsculas y minúsculas</p>
        <p [class.met]="hasNumber(newPassword)">✓ Números y símbolos</p>
    </div>

    <ion-button expand="block" (click)="updatePassword()" [disabled]="!isFormValid()" class="submit-btn">
        Guardar Nueva Contraseña
    </ion-button>
</ion-content>
