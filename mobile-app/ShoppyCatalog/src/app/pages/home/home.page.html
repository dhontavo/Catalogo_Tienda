<app-menu>
  <!-- Buscador -->
  <ion-searchbar placeholder="Buscar productos..." class="cf-search"></ion-searchbar>

  <!-- Grid -->
  <div class="cf-grid">
    <div class="cf-card" *ngFor="let product of products">
      <img [src]="product.image" />
      <div class="cf-card-body">
        <h3 class="cf-title">{{product.name}}</h3>
        <p class="cf-price">${{product.price}}</p>
      </div>
    </div>
  </div>

  <!-- FAB -->
  <ion-fab vertical="bottom" horizontal="end" class="cf-fab">
    <ion-fab-button (click)="openModal()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>


</app-menu>
