<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login" text=""></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="register-content">
  <div class="register-container">

    <div class="header-section">
      <div class="logo-ring">
        <ion-img src="assets/icon/favicon.png" class="mini-logo"></ion-img>
      </div>
      <h2>Crea tu cuenta</h2>
      <p>Únete a la gestión inteligente de ShoppyCatalog</p>
    </div>


    <div class="form-card">
      <!-- Datos Personales -->
      <ion-row>
        <ion-col size="12">
          <ion-item lines="none" class="custom-input">
            <ion-icon name="person-outline" slot="start"></ion-icon>
            <!-- <ion-label position="stacked">Nombre</ion-label> -->
            <ion-input type="text" placeholder="Nombre (s)"></ion-input>
          </ion-item>
        </ion-col>
        <ion-col size="12">
          <ion-item lines="none" class="custom-input">
            <ion-icon name="person-outline" slot="start"></ion-icon>
            <!-- <ion-label position="stacked">Apellido</ion-label> -->
            <ion-input type="text" placeholder="Apellido (S)"></ion-input>
          </ion-item>
        </ion-col>
        <ion-col size="12">
          <ion-item lines="none" class="custom-input">
            <ion-icon name="mail-outline" slot="start"></ion-icon>
            <!-- <ion-label position="stacked">Nombre de usuario</ion-label> -->
            <ion-input type="email" placeholder="Correo electronico"></ion-input>
          </ion-item>
        </ion-col>
      </ion-row>

      <!-- Usuario -->
      <ion-item lines="none" class="custom-input">
        <ion-icon name="at-outline" slot="start"></ion-icon>
        <!-- <ion-label position="stacked">Nombre de usuario</ion-label> -->
        <ion-input type="text" placeholder="Nombre de usuario"></ion-input>
      </ion-item>

      <!-- Fecha de nacimiento -->
      <ion-item lines="none" class="custom-input">
        <ion-icon name="calendar-outline" slot="start"></ion-icon>
        <!-- <ion-label position="stacked">Fecha de nacimiento</ion-label> -->
        <ion-datetime-button datetime="birthday"></ion-datetime-button>
        <ion-modal [keepContentsMounted]="true">
          <ng-template>
            <ion-datetime id="birthday" presentation="date"></ion-datetime>
          </ng-template>
        </ion-modal>
      </ion-item>

      <!-- Seguridad -->
      <ion-item lines="none" class="custom-input">
        <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
        <!-- <ion-label position="stacked">Contraseña</ion-label> -->
        <ion-input type="password" placeholder="••••••••"></ion-input>
      </ion-item>

      <!-- Datos de Tienda (id_store) -->
      <ion-item lines="none" class="custom-input">
        <ion-icon name="storefront-outline" slot="start"></ion-icon>
        <!-- <ion-label position="stacked">ID de tu Tienda</ion-label> -->
        <ion-input type="text" placeholder="Nombre de tienda"></ion-input>
      </ion-item>

      <ion-button expand="block" class="register-button">
        Registrar plataforma
      </ion-button>
    </div>

    <p class="terms">
      Al registrarte, aceptas nuestros <span>Términos y Condiciones</span>.
    </p>
  </div>
</ion-content>
