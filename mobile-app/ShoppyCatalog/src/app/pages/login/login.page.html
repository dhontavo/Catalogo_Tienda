<ion-content [fullscreen]="true" [scrollY]="false" class="login-content">
  <div class="login-container">

    <div class="logo-wrapper">
      <div class="logo-ring">
        <img src="assets/icon/favicon.png" alt="ShoppyCatalog Logo" class="app-logo">
      </div>
      <h1 class="brand-name">Shoppy<span>Catalog</span></h1>
      <p class="tagline">Gestión inteligente de productos</p>
    </div>

    <div class="form-section">
      <ion-item lines="none" class="custom-input">
        <ion-icon name="person-outline" slot="start"></ion-icon>
        <ion-input type="email" placeholder="Usuario" [(ngModel)]="form.username"></ion-input>
      </ion-item>

      <ion-item lines="none" class="custom-input">
        <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
        <ion-input [type]="showPassword ? 'text' : 'password'" placeholder="Contraseña"
          [(ngModel)]="form.password"></ion-input>
        <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'" slot="end"
          (click)="togglePasswordVisibility()">
        </ion-icon>
      </ion-item>

      <ion-button expand="block" class="login-button" (click)="login()">
        Iniciar Sesión
      </ion-button>

      <div class="footer-links">
        <p class="forgot-link" (click)="routerPath('lost-pass')">¿Olvidaste tu contraseña?</p>
        <p class="signup-text" (click)="routerPath('new-account')">Crear cuenta nueva</p>
      </div>
    </div>

  </div>
</ion-content>
